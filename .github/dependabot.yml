version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let a release age before it is proposed: a compromised or broken
    # publish is usually yanked within days.
    cooldown:
      default-days: 5
    # Every dependency is a dev dependency (the theme ships compiled CSS and
    # JS, never node_modules), so one grouped PR a week is one review of the
    # toolchain. Keep an upgrade that rewrites asset/css/ separate from an
    # advisory fix when reviewing it (CLAUDE.md, "An unfixable advisory…").
    groups:
      development-tooling:
        patterns:
          - '*'

  # No composer entry: composer.json declares only the PHP floor (no
  # packages, no lockfile), so there is nothing for Dependabot to update.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Every action is pinned to a full commit SHA with a `# vX` comment, and
    # the same action carries the same pin in every workflow. One grouped PR
    # moves them all together, so the pins cannot drift apart again.
    groups:
      github-actions:
        patterns:
          - '*'
