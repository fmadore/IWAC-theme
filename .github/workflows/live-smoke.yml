name: Live site smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * 1'

permissions:
  contents: read

concurrency:
  group: live-site-smoke
  cancel-in-progress: true

jobs:
  chromium:
    name: Search, responsive UI, and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Two Playwright projects (playwright.config.js): the English and the
      # French site, which have their own slugs, strings and module config.
      - run: npm run test:live
        env:
          IWAC_LIVE_BASE_URL: https://islam.zmo.de/s/westafrica
          IWAC_LIVE_FR_BASE_URL: https://islam.zmo.de/s/afrique_ouest
