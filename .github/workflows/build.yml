name: Quality

on:
  push:
    branches: [master]
  pull_request:
  # Also a reusable workflow: release.yml calls it on the tagged tree and will
  # not publish unless every job here passes. A reusable call ignores path
  # filters, so the whole suite always runs.
  workflow_call:
    inputs:
      ref:
        description: 'The ref to check out (the release tag); empty means the triggering ref'
        type: string
        required: false
        default: ''

permissions:
  contents: read

# The event is part of the group: when release.yml calls this workflow, the
# github context is the caller's, and a release rebuilt by hand runs on a
# branch ref — without the event name, the next push to that branch would
# cancel the release's gates mid-run (and the release with them).
concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build, unit tests, and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check:js
      # ESLint (correctness rules) + Stylelint (bug-catching rules, plus the
      # CLAUDE.md gotchas: no @import, no color-mix in srgb, no outline:none).
      - run: npm run lint

      # Catches a version declaration drifting on the commit that drifts it,
      # rather than at the next release — or, as with package-lock.json's two
      # copies, four releases later.
      - run: npm run check:versions

      - run: npm test
      # The same behaviour suite against asset/js/dist/*.min.js — what pages
      # actually load. Proves minification kept every global the scripts
      # publish and read (IWACUtils, the PWA island, …).
      - run: npm run test:minified
      # Before the build rewrites them: a stale twin shows in the diff below,
      # but a MISSING one (a new source whose .min.js was never committed)
      # would be an untracked file that `git diff` cannot see.
      - run: npm run check:js-dist
      - run: npm run build

      - name: Generated artifacts must match the committed ones
        run: git diff --exit-code

      # Last, because it is the one step a third party can turn red overnight:
      # placed before the diff, a new advisory skipped the artifact check on
      # every push until it was dealt with. Exceptions, each with its reason,
      # are in scripts/lib/audit-exceptions.js.
      - run: npm run check:audit

  php:
    name: PHP ${{ matrix.php }} syntax and Composer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2, phpstan:2

      - run: composer validate --strict --no-check-publish

      - name: PHP syntax check (templates and helpers)
        run: find view helper -type f \( -name '*.phtml' -o -name '*.php' \) -print0 | xargs -0 -n1 php -l

      - name: Validate theme configuration
        run: php -r 'if (false === parse_ini_file("config/theme.ini", true, INI_SCANNER_RAW)) { exit(1); }'

      # Behaviour, not just syntax: the view helpers, and template logic that
      # has broken before (a cleared footer-depth field 500ing every page,
      # duplicate annotation ids). Plain PHP — no Composer install needed.
      - name: Helper and template tests
        run: php test/php/run.php

      # The pages the JS behaviour suite runs against, rendered from the
      # templates by test/php/render-fixtures.php and committed. Fails when a
      # template changed without `npm run build:fixtures` — the JS tests would
      # otherwise keep passing against the old markup — and, on two PHP
      # versions, when a render is not byte-for-byte the same on both.
      - name: Rendered test fixtures are current
        run: php test/php/render-fixtures.php --check

      # The view helpers, at level 6 against the stubbed Laminas base class
      # (phpstan.neon.dist). Installed by setup-php, so composer.json — which
      # ships in the release — stays free of dev dependencies.
      - name: PHPStan
        run: phpstan analyse --no-progress
