name: Quality

on:
  push:
    branches: [master]
  pull_request:
  # Also a reusable workflow: release.yml calls it on the tagged tree and will
  # not publish unless every job here passes. A reusable call ignores path
  # filters, so the whole suite always runs.
  workflow_call:
    inputs:
      ref:
        description: 'The ref to check out (the release tag); empty means the triggering ref'
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  # The Omeka S release the omeka-compatibility job installs the theme into.
  # Keep it equal to OMEKA_S_VERSION in release.yml; live-smoke.yml warns when
  # a newer one exists.
  OMEKA_S_VERSION: 4.2.1
  # The release asset's published digest:
  #   gh api repos/omeka/omeka-s/releases/tags/v<version> --jq '.assets[].digest'
  OMEKA_S_SHA256: cc27d1c7aca0209523d19aa285f4a08e29e34950dcc446951a7c1311de348e82

# The event is part of the group: when release.yml calls this workflow, the
# github context is the caller's, and a release rebuilt by hand runs on a
# branch ref — without the event name, the next push to that branch would
# cancel the release's gates mid-run (and the release with them).
concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build, unit tests, and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The same command a contributor runs before pushing (package.json), so
      # "green locally" and "green here" mean one thing. In order:
      #   check:js         node --check over every script
      #   lint             ESLint + Stylelint (correctness rules, plus the
      #                    CLAUDE.md gotchas: no @import, no color-mix in
      #                    srgb, no outline:none)
      #   check:versions   every version declaration agrees, on the commit
      #                    that drifts one rather than at the next release
      #   test             the behaviour suite on the rendered fixtures
      #   test:minified    the same suite against asset/js/dist/*.min.js —
      #                    what pages load; proves minification kept every
      #                    global the scripts publish and read
      #   check:js-dist    before the build rewrites them: a MISSING twin
      #                    would be an untracked file a diff cannot see
      #   build            tokens, i18n, JS twins, CSS
      #   check:generated  the build changed nothing: any difference names
      #                    the stale artifact and the command that fixes it
      #                    (strict here, because GITHUB_ACTIONS is set)
      #   check:php        skipped in this job (IWAC_SKIP_PHP): the runner
      #                    image's PHP is below the theme's floor, and the PHP
      #                    job below runs it with --require on 8.4 and 8.5
      #   check:audit      last, because it is the one step a third party can
      #                    turn red overnight; placed before the artifact
      #                    check, a new advisory hid it on every push.
      #                    Exceptions, each with its reason, are in
      #                    scripts/lib/audit-exceptions.js.
      - name: npm run verify
        env:
          IWAC_SKIP_PHP: '1'
        run: npm run verify

  php:
    name: PHP ${{ matrix.php }} syntax, tests and Composer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - run: composer validate --strict --no-check-publish

      # Plain Node built-ins, so no `npm ci`: the runner's preinstalled Node
      # is enough. --require makes a missing PHP fatal (locally it skips).
      #   1. php -l over every template and helper
      #   2. config/theme.ini parses as Omeka parses it (INI_SCANNER_RAW)
      #   3. test/php/run.php — the view helpers, and template logic that has
      #      broken before (a cleared footer-depth field 500ing every page,
      #      duplicate annotation ids)
      #   4. the rendered fixtures the JS suite runs on are current — and, on
      #      two PHP versions, byte-for-byte the same on both
      - name: PHP syntax, theme.ini, helper tests and rendered fixtures
        run: node scripts/check-php.js --require

  # The theme inside the real Omeka S release, not beside a fake: Omeka's own
  # theme manager discovers and parses it, the helpers load the way Omeka
  # registers them, and PHPStan checks them against the real Omeka and Laminas
  # classes. PHP 8.5, production's version, with every deprecation an error.
  # (A job name cannot read `env`; the version is in the step names.)
  omeka-compatibility:
    name: Omeka S release + PHP 8.5
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # PHPStan is installed by setup-php, so composer.json — which ships in
      # the release — stays free of dev dependencies.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          extensions: mbstring, pdo_mysql, pdo_sqlite, xml
          tools: phpstan:2.3.3

      - name: Download official Omeka S ${{ env.OMEKA_S_VERSION }} release (SHA-256 verified)
        run: |
          mkdir -p "$RUNNER_TEMP/omeka"
          curl -fsSL "https://github.com/omeka/omeka-s/releases/download/v$OMEKA_S_VERSION/omeka-s-$OMEKA_S_VERSION.zip" -o "$RUNNER_TEMP/omeka.zip"
          echo "$OMEKA_S_SHA256  $RUNNER_TEMP/omeka.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/omeka.zip" -d "$RUNNER_TEMP/omeka"
          OMEKA_ROOT="$(find "$RUNNER_TEMP/omeka" -maxdepth 2 -name bootstrap.php -printf '%h\n' -quit)"
          test -n "$OMEKA_ROOT"
          echo "OMEKA_ROOT=$OMEKA_ROOT" >> "$GITHUB_ENV"

      # The directory name is the Omeka theme id; the live sites are
      # configured against IWAC-theme (release.yml's archive prefix).
      - name: Install the theme into Omeka as themes/IWAC-theme
        run: |
          mkdir -p "$OMEKA_ROOT/themes/IWAC-theme"
          rsync -a --exclude='.git' --exclude='node_modules' ./ "$OMEKA_ROOT/themes/IWAC-theme/"

      - name: Omeka S ${{ env.OMEKA_S_VERSION }} discovers the theme and loads its helpers
        env:
          OMEKA_PATH: ${{ env.OMEKA_ROOT }}
        run: php -d error_reporting=E_ALL -d display_errors=1 test/php/omeka-compatibility.php

      # The view helpers against the real Omeka S and Laminas classes, for PHP
      # 8.4 through 8.5 (phpstan.neon.dist).
      - name: Static analysis of the view helpers (PHPStan)
        env:
          OMEKA_PATH: ${{ env.OMEKA_ROOT }}
        run: phpstan analyse --no-progress --error-format=github --memory-limit=1G
