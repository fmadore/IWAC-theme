name: Release

# Publishes the installable theme archive. Tag and push to trigger:
#
#     git tag v2.9.5 && git push origin v2.9.5
#
# Three jobs, so that nothing ships unchecked and no build code runs with a
# write token:
#
#   gates    the whole push/PR suite (build.yml, called as a reusable
#            workflow) on the tagged tree: lint, behaviour tests (source and
#            minified), test:php on both PHP legs, PHPStan, the check:* guards,
#            the generated-artifact diff and the audit. Until this existed a
#            release ran none of them, so a tag could ship a tree whose suite
#            had never passed.
#   build    a read-only job: asserts the tag is on the default branch and
#            agrees with every version declaration, rebuilds and diffs the
#            committed artifacts, assembles and verifies the archive, installs
#            the UNPACKED archive into the official Omeka S release and has
#            Omeka's theme manager discover it (build.yml's omeka-compatibility
#            job tests the working tree, which has files the archive does not —
#            so an export-ignore mistake would otherwise reach the live site
#            untested), and uploads it as a run artifact. npm ci and the build run here, with
#            no write token in reach (persist-credentials: false).
#   publish  needs both, holds `contents: write`, and does nothing but
#            download that artifact and attach it to the release. A release
#            it has to create gets that version's CHANGELOG.md section as its
#            notes (extracted by the build job), or GitHub's generated notes
#            with a warning when the version has none.
#
# Workflow inputs reach shell steps through `env:`, never interpolated into
# `run:`. Actions are pinned to commit SHAs; Dependabot keeps the pins current.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build the release asset for, e.g. v2.9.5'
        required: true

permissions:
  contents: read

env:
  # The Omeka S release the packaged theme is installed into. Keep
  # it equal to OMEKA_S_VERSION in build.yml; live-smoke.yml warns when
  # a newer one exists.
  OMEKA_S_VERSION: 4.2.1
  # The release asset's published digest:
  #   gh api repos/omeka/omeka-s/releases/tags/v<version> --jq '.assets[].digest'
  OMEKA_S_SHA256: cc27d1c7aca0209523d19aa285f4a08e29e34950dcc446951a7c1311de348e82

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: Quality suite on the tagged tree
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  build:
    name: Build and verify installable archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      zip: ${{ steps.zip.outputs.name }}
    env:
      TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # fetch-depth 0 so the ancestry check below can see the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve tag and version
        id: v
        run: |
          echo "tag=$TAG_INPUT" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_INPUT#v}" >> "$GITHUB_OUTPUT"

      # A tag on a commit that never reached the default branch (a local
      # experiment, a branch nobody merged) would publish code that has had no
      # review and that master does not contain. The gates job proves the tree
      # is green; this proves it is the tree everyone else has.
      - name: The tagged commit must be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "::error::$TAG_INPUT ($(git rev-parse HEAD)) is not an ancestor of origin/$DEFAULT_BRANCH; merge it before tagging"
            exit 1
          fi

      # Several files carry the version; a tag that disagrees with any of them
      # ships a theme whose admin screen, stylesheet header or citation record
      # lies about itself. The list of declarations lives in
      # scripts/lib/versions.js — the same list `npm run bump` writes — so this
      # gate cannot fall behind the writer the way the old inline copy did:
      # style.scss joined it in 2.9.14 after drifting from 2.9.0 across
      # thirteen unchecked releases, and package-lock.json's two copies had
      # drifted from 2.10.1 across four more before the list was shared.
      - name: Every version declaration must match the tag
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: node scripts/check-versions.js "$VERSION"

      - run: npm ci

      # The gates job ran the full suite; this rebuild exists because the
      # archive is assembled from THIS job's tree and must carry exactly the
      # artifacts its sources produce.
      - name: Committed build artifacts must be current
        run: |
          npm run build
          node scripts/check-generated.js --strict

      # The theme directory name is the Omeka S theme id. Sites at islam.zmo.de
      # are configured against "IWAC-theme", so the archive must extract to a
      # directory of exactly that name or an in-place upgrade orphans them.
      - name: Build installable archive
        id: zip
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          NAME="IWAC-theme-$TAG.zip"
          git archive --format=zip --prefix=IWAC-theme/ -o "$NAME" HEAD
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Archive must be installable and free of dev tooling
        env:
          NAME: ${{ steps.zip.outputs.name }}
        run: |
          unzip -Z1 "$NAME" > /tmp/list

          # Everything Omeka needs to load the theme.
          for f in config/theme.ini theme.jpg asset/css/style.css language/fr.mo \
                   view/layout/layout.phtml helper/BrowseLayout.php LICENSE README.md \
                   CHANGELOG.md asset/css/fonts.css asset/fonts/besley-latin-800-normal.woff2 \
                   asset/fonts/public-sans-latin-wght-normal.woff2 asset/fonts/OFL-Besley.txt; do
            grep -qx "IWAC-theme/$f" /tmp/list || { echo "::error::missing $f"; exit 1; }
          done

          # Nothing that only exists to develop it.
          #
          # The exclusions are DERIVED from .gitattributes rather than restated
          # here. This used to be a hand-kept regex, and it drifted the way
          # every hand-kept list in this repo has drifted: it named
          # `.impeccable(\.md|/)` and `ROADMAP\.md`, so it passed while
          # DESIGN.md, PRODUCT.md and docs/IMPECCABLE-ROADMAP.md shipped to the
          # live server in ten consecutive releases. Same lesson as
          # scripts/lib/versions.js — make the list data and have both sides
          # read it.
          mapfile -t IGNORED < <(sed -n 's|^/\([^[:space:]]*\)[[:space:]]\{1,\}export-ignore.*|\1|p' .gitattributes)
          if [ "${#IGNORED[@]}" -eq 0 ]; then
            echo "::error::parsed no export-ignore rules from .gitattributes — this guard would pass vacuously"
            exit 1
          fi
          echo "checking ${#IGNORED[@]} export-ignore rules against $(wc -l < /tmp/list) archived files"

          leaked=0
          while IFS= read -r entry; do
            # `unzip -Z1` lists directory entries too (IWAC-theme/, docs/…);
            # they carry no content and would match nothing useful.
            case "$entry" in */) continue ;; esac
            rel="${entry#IWAC-theme/}"
            [ "$rel" = "$entry" ] && continue
            for pat in "${IGNORED[@]}"; do
              case "$pat" in
                */) [ "${rel##"$pat"}" != "$rel" ] && { echo "::error::$entry leaked (export-ignore /$pat)"; leaked=1; } ;;
                # Unquoted RHS: .gitattributes carries globs (/language/*.pot).
                *)  [[ "$rel" == $pat ]] && { echo "::error::$entry leaked (export-ignore /$pat)"; leaked=1; } ;;
              esac
            done
          done < /tmp/list
          if [ "$leaked" -ne 0 ]; then
            echo "::error::development files leaked into the release archive — check .gitattributes export-ignore"
            exit 1
          fi

          # ...and nothing nobody has classified yet.
          #
          # A denylist can only catch a rule that stopped matching; it cannot
          # catch a file for which no rule was ever written, and that is the
          # failure above. So the archive's ROOT is an allowlist: a new
          # top-level file has to be declared ship-or-strip here or the release
          # fails. Subdirectories stay open — templates, helpers, assets and
          # docs are added freely — but the root is where tooling artifacts
          # land, which is why both offenders were sitting there.
          if [ -n "$(comm -23 \
                <(sed -n 's|^IWAC-theme/\([^/][^/]*\)$|\1|p' /tmp/list | sort -u) \
                <(printf '%s\n' CHANGELOG.md CITATION.cff LICENSE README.md composer.json theme.jpg tokens.json | sort))" ]; then
            echo "::error::unclassified file(s) at the archive root:"
            comm -23 \
              <(sed -n 's|^IWAC-theme/\([^/][^/]*\)$|\1|p' /tmp/list | sort -u) \
              <(printf '%s\n' CHANGELOG.md CITATION.cff LICENSE README.md composer.json theme.jpg tokens.json | sort)
            echo "::error::either export-ignore it in .gitattributes or add it to this allowlist"
            exit 1
          fi

          echo "$(wc -l < /tmp/list) files, $(du -h "$NAME" | cut -f1)"

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          extensions: mbstring, pdo_mysql, pdo_sqlite, xml

      # The artefact people install, through Omeka's own theme manager: the
      # same test build.yml runs on the working tree, here on the unpacked
      # ZIP, so anything export-ignore removed by mistake (a helper, a
      # template, theme.ini) fails the release.
      - name: Omeka S ${{ env.OMEKA_S_VERSION }} discovers the packaged theme
        env:
          NAME: ${{ steps.zip.outputs.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/omeka" "$RUNNER_TEMP/pkg"
          curl -fsSL "https://github.com/omeka/omeka-s/releases/download/v$OMEKA_S_VERSION/omeka-s-$OMEKA_S_VERSION.zip" -o "$RUNNER_TEMP/omeka.zip"
          echo "$OMEKA_S_SHA256  $RUNNER_TEMP/omeka.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/omeka.zip" -d "$RUNNER_TEMP/omeka"
          OMEKA_ROOT="$(find "$RUNNER_TEMP/omeka" -maxdepth 2 -name bootstrap.php -printf '%h\n' -quit)"
          test -n "$OMEKA_ROOT"
          unzip -q "$NAME" -d "$RUNNER_TEMP/pkg"
          mkdir -p "$OMEKA_ROOT/themes"
          cp -r "$RUNNER_TEMP/pkg/IWAC-theme" "$OMEKA_ROOT/themes/IWAC-theme"
          OMEKA_PATH="$OMEKA_ROOT" php -d error_reporting=E_ALL -d display_errors=1 test/php/omeka-compatibility.php

      # The notes of a release the publish job has to create: this version's
      # CHANGELOG.md section as committed at the tag (`npm run bump` promoted
      # [Unreleased] into it). Extracted here, where the tree is checked out,
      # so the write-token job runs no repository code. An empty file means
      # "no section": publish falls back to generated notes and says so.
      - name: Extract this version's CHANGELOG.md notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if ! node scripts/changelog-section.js "$VERSION" > release-notes.md; then
            : > release-notes.md
            echo "::warning::CHANGELOG.md has no section for $VERSION — a new release would get generated notes"
          fi

      - name: Upload the archive as a run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.zip.outputs.name }}
          path: |
            ${{ steps.zip.outputs.name }}
            release-notes.md
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [gates, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.zip }}

      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          NAME: ${{ needs.build.outputs.zip }}
        run: |
          set -euo pipefail
          test -f "$NAME"
          # An existing release keeps its notes and just gets the archive.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NAME" --clobber
          elif [ -s release-notes.md ]; then
            gh release create "$TAG" "$NAME" --title "$TAG" --notes-file release-notes.md --verify-tag
            echo "::notice::Published $TAG with its CHANGELOG.md notes."
          else
            echo "::warning::CHANGELOG.md has no section for $TAG — the release gets generated notes instead."
            gh release create "$TAG" "$NAME" --title "$TAG" --generate-notes --verify-tag
          fi
